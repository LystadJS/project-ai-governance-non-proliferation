name: Validate Public Reproducibility Layer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public project
        uses: actions/checkout@v4

      - name: Check out research registry
        uses: actions/checkout@v4
        with:
          repository: LystadJS/research-registry
          path: .registry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install registry dependencies
        run: pip install -r .registry/requirements.txt

      - name: Validate project manifest
        run: python .registry/scripts/validate_manifest.py --type project --file .research/project.yml

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Run exact PCoA reproduction
        run: Rscript analysis/01_pcoa_process_terrain.R

      - name: Parse sanitized figure workflow
        run: Rscript -e 'parse(file="analysis/02_strategic_terrain_figure.R")'

      - name: Verify expected PCoA outputs
        run: |
          test -f pcoa_outputs/pcoa_coordinates.csv
          test -f pcoa_outputs/pcoa_diagnostics.csv
          test -f pcoa_outputs/pcoa_input_feature_matrix.csv
